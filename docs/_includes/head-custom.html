<link rel="alternate" type="application/atom+xml" title="Plastic Signal Weekly" href="{{ '/feed-en.xml' | relative_url }}">
<meta name="theme-color" content="#f3f0e8">
<style>
:root{--ink:#17211c;--paper:#f3f0e8;--acid:#d7ff38;--line:rgba(23,33,28,.2);--muted:#667069}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;font-size:16px;line-height:1.6}.page-header{display:none}.main-content{max-width:none!important;padding:0!important;margin:0!important}.main-content a{color:inherit;text-decoration:none}.signal-hero{min-height:88vh;padding:40px max(6vw,32px) 56px;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden;border-bottom:1px solid var(--ink)}.signal-hero:after{content:"";position:absolute;width:38vw;height:38vw;right:-10vw;top:10vh;border:1px solid var(--ink);border-radius:50%;box-shadow:0 0 0 5vw var(--paper),0 0 0 calc(5vw + 1px) var(--ink),0 0 0 12vw var(--paper),0 0 0 calc(12vw + 1px) var(--ink);opacity:.18}.eyebrow,.section-number{font:500 11px DM Mono,monospace;letter-spacing:.16em;text-transform:uppercase}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acid);border:1px solid var(--ink);margin-right:8px;animation:pulse 2s infinite}.signal-hero h1{font-size:clamp(64px,11vw,160px);line-height:.82;letter-spacing:-.075em;margin:9vh 0 36px;max-width:1100px;position:relative;z-index:1}.signal-hero h1 em{font-family:Newsreader,serif;font-weight:400}.hero-copy{font-size:clamp(18px,2vw,25px);line-height:1.45;max-width:700px;margin:0 0 34px}.hero-actions{display:flex;align-items:center;gap:28px}.primary-action{display:inline-flex;gap:44px;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper)!important;padding:17px 20px;min-width:280px;font-weight:600}.primary-action:hover{background:var(--acid);color:var(--ink)!important}.text-action{border-bottom:1px solid var(--ink)}.edition-stamp{position:absolute;right:6vw;bottom:55px;display:grid;gap:3px;font:11px DM Mono,monospace;text-align:right;z-index:1}.edition-stamp strong{font-size:15px}.signal-bar{padding:18px max(6vw,32px);display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:var(--paper);font:11px DM Mono,monospace;letter-spacing:.12em}.signal-bar i{width:4px;height:4px;border-radius:50%;background:var(--acid)}.editorial-intro,.pillar-section,.latest-section,.method-section{padding:110px max(6vw,32px);border-bottom:1px solid var(--ink)}.editorial-intro{display:grid;grid-template-columns:1fr 3fr;gap:40px}.editorial-intro h2,.latest-header h2,.method-copy h2{font-size:clamp(42px,6vw,86px);line-height:1;letter-spacing:-.055em;margin:0 0 35px}.editorial-intro p{font-size:22px;max-width:800px}.pillar-section>.section-number,.latest-section>.section-number,.method-section>.section-number{margin-bottom:55px}.pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink)}.pillar-grid article{min-height:265px;padding:22px;display:flex;flex-direction:column;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transition:.25s ease}.pillar-grid article:hover{background:var(--acid);transform:translate(-5px,-5px);box-shadow:5px 5px 0 var(--ink)}.pillar-grid b{font:11px DM Mono,monospace}.pillar-grid h3{font-size:26px;line-height:1.05;letter-spacing:-.035em;margin:auto 0 20px}.pillar-grid p{font-size:13px;line-height:1.45;margin:0;color:var(--muted)}.pillar-grid article:hover p{color:var(--ink)}.latest-section{background:#deddd3}.latest-header{display:flex;justify-content:space-between;align-items:end}.latest-header p{font:12px DM Mono,monospace}.issue-list{border-top:1px solid var(--ink)}.issue-row{display:grid;grid-template-columns:160px 1fr 40px;align-items:center;padding:25px 0;border-bottom:1px solid var(--line);transition:.2s}.issue-row:hover{padding-left:14px;background:var(--acid)}.issue-date{font:11px DM Mono,monospace;text-transform:uppercase}.issue-title{font-size:22px;font-weight:600}.issue-arrow{text-align:right}.issue-empty{padding:34px 0;display:flex;gap:18px;flex-direction:column}.method-section{display:grid;grid-template-columns:1fr 1.2fr;gap:60px}.method-section>.section-number{grid-column:1/-1}.method-section ol{list-style:none;padding:0;margin:0;border-top:1px solid var(--ink)}.method-section li{display:grid;grid-template-columns:60px 1fr;padding:20px 0;border-bottom:1px solid var(--line)}.method-section li b{font:11px DM Mono,monospace}.method-section li span{display:grid;grid-template-columns:140px 1fr}.signal-footer{padding:28px max(6vw,32px);display:flex;justify-content:space-between;background:var(--acid);font:11px DM Mono,monospace;letter-spacing:.1em}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(215,255,56,0)}}
@media(max-width:820px){.signal-hero{min-height:760px}.signal-hero h1{margin-top:80px}.edition-stamp{display:none}.signal-bar span:nth-of-type(even),.signal-bar i:nth-of-type(even){display:none}.editorial-intro{grid-template-columns:1fr}.pillar-grid{grid-template-columns:repeat(2,1fr)}.latest-header{display:block}.issue-row{grid-template-columns:105px 1fr 24px}.method-section{grid-template-columns:1fr}.method-section li span{grid-template-columns:1fr}.signal-footer{gap:30px}}
@media(max-width:520px){.signal-hero,.editorial-intro,.pillar-section,.latest-section,.method-section{padding-left:22px;padding-right:22px}.signal-hero h1{font-size:60px}.hero-actions{align-items:flex-start;flex-direction:column}.pillar-grid{grid-template-columns:1fr}.pillar-grid article{min-height:210px}.issue-date{display:none}.issue-row{grid-template-columns:1fr 24px}.signal-footer{flex-direction:column}}
</style>
